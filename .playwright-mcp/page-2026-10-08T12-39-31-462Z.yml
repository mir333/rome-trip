        - article [ref=e416]:
          - heading "Pantheon (Basilica of St Mary and the Martyrs)" [level=3] [ref=e417]
          - generic [ref=e418]: Centre · Day 1 · Wed 14 Oct
          - paragraph [ref=e419]: Hadrian's temple of AD 125, consecrated as a church in 609, which is why it survives intact. The unreinforced concrete dome, 43.3 m wide with its open oculus, was the world's largest for 1,300 years. Raphael and two kings of Italy are buried here.
