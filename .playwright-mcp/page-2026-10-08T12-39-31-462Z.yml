        - article [ref=e459]:
          - heading "Vatican Museums & Sistine Chapel" [level=3] [ref=e460]
          - generic [ref=e461]: Vatican · Day 2 · Thu 15 Oct
          - paragraph [ref=e462]: "Five centuries of papal collecting over 7 km of galleries: the Laocoön and the Belvedere Torso, the Gallery of Maps, Raphael's Stanze (the School of Athens), and finally the Sistine Chapel, where Michelangelo painted the ceiling (1508–12) and the Last Judgement (1536–41) and where the conclave that elected Leo XIV met in May 2025. Allow 3–4 hours."
          - generic [ref=e463]:
            - term [ref=e464]: Price
            - definition [ref=e465]: €20 + €5 online booking fee. Reduced rates for under-18s.
            - term [ref=e466]: Hours
            - definition [ref=e467]: Mon–Sat 08:00–20:00, last entry 18:00. Closed Sundays (except last Sunday of month, free).
          - list [ref=e468]:
            - listitem [ref=e469]: "Tickets open 60 days ahead and the early slots sell out: book the earliest slot available right now."
            - listitem [ref=e470]: "Walk the museum in order: Pinacoteca first if you like painting, then the long route to the Sistine Chapel."
            - listitem [ref=e471]: Silence and no photos in the Sistine Chapel.
            - listitem [ref=e472]: Beware of resellers; the official price is €25.
