      - paragraph [ref=e738]: Your ceiling of £500 is about €575. The core plan uses £226, leaving roughly £274 spare for a guided tour of the Vatican Museums or the Colosseum underground (typically €50–90 per person) if you want one, or for the Scavi tour if a slot comes through.
    - generic [ref=e739]:
      - heading "Getting there and around" [level=2] [ref=e740]
      - generic [ref=e741]:
        - strong [ref=e742]: Check your hotel address.
        - text: Via Aurelia 25, Stagno, 57017 Livorno is in Tuscany, about 300 km north of Rome and 3 hours away by train. This plan assumes you sleep in Rome. If the Livorno booking is right, see the fallback below.
      - heading "If you are based in Rome" [level=3] [ref=e743]
      - list [ref=e744]:
        - listitem [ref=e745]:
          - strong [ref=e746]: "From Fiumicino airport:"
          - text: Leonardo Express to Termini, 32 min, €14; or the FL1 regional to Trastevere or Ostiense, €8, if your hotel is on that side.
        - listitem [ref=e747]:
          - strong [ref=e748]: "From Ciampino airport:"
          - text: shuttle bus to Termini, about 40 min, €6–7.
        - listitem [ref=e749]:
          - strong [ref=e750]: "Public transport:"
          - text: one ATAC ticket covers metro, bus and tram. Single BIT €1.50 for 100 minutes; 24h €8.50; 48h €15; 72h €22; weekly CIS €29. For five days the weekly CIS is the cheapest. Buy at any metro station or tabacchi, or tap a contactless card at the metro gates and on buses (fares are capped daily). Validate paper tickets on every bus.
        - listitem [ref=e751]:
          - strong [ref=e752]: "Walking:"
          - text: the centre is compact. The Vatican to the Colosseum is about 4 km; most days here are 5–7 km on foot. Cobbles are hard on feet, so wear your most comfortable shoes.
        - listitem [ref=e753]:
          - strong [ref=e754]: "Metro lines you will use:"
          - text: A (red) Ottaviano for the Vatican, Flaminio and Spagna for the north centre, San Giovanni for the Lateran. B (blue) Colosseo, Circo Massimo, Basilica San Paolo. The lines meet at Termini.
        - listitem [ref=e755]:
          - strong [ref=e756]: "Where to stay if still choosing:"
          - text: Prati or Borgo for the Vatican, or Monti for the Colosseum. Both have Metro A or B and are walkable to everything.
      - 'heading "Fallback: if the hotel really is in Livorno" [level=3] [ref=e757]'
      - list [ref=e758]:
        - listitem [ref=e759]:
          - strong [ref=e760]: "Train:"
          - text: Livorno Centrale to Roma Termini, about 11 direct Intercity trains a day, 2h40–3h20, from about €15–20 each way if booked ahead on
          - link "Trenitalia" [ref=e761] [cursor=pointer]:
            - /url: https://www.trenitalia.com/en.html
          - text: . Frecciarossa from Pisa or Florence is faster but from about €64.
        - listitem [ref=e762]:
          - strong [ref=e763]: "Hotel to station:"
          - text: Stagno is about 8 km from Livorno Centrale; an LAM Rossa / line 1 bus or a taxi (about €20).
        - listitem [ref=e764]:
          - strong [ref=e765]: "Realistic plan:"
          - text: "two long day trips rather than four. Take the ~06:00 train, arrive ~09:00, return on the ~19:30–20:30 train. Day trip 1: the Vatican day (General Audience, basilica, dome, Pantheon). Day trip 2: Colosseum, Forum, Capitoline, Santa Maria Maggiore (it is 5 minutes from Termini). Drop the Vatican Museums early slot to 10:00 or skip the Borghese and catacombs."
        - listitem [ref=e766]:
          - strong [ref=e767]: "Better:"
          - text: if you can still change it, move the booking to Rome. Four nights in Rome will cost less than four return train days and give you the evenings.
      - heading "Vatican extras worth a try" [level=3] [ref=e768]
      - list [ref=e769]:
        - listitem [ref=e770]:
          - strong [ref=e771]: "Scavi tour (St Peter's tomb under the basilica):"
          - text: small groups, roughly €20 pp, requested on the
          - link "official reservation page" [ref=e772] [cursor=pointer]:
            - /url: https://visite.basilicasanpietro.va/en/booking/necropolivaticana
          - text: . Confirmations take six weeks or more, so a request today is a long shot, but it costs nothing to ask.
        - listitem [ref=e773]:
          - strong [ref=e774]: "Sunday Mass times at St Peter's:"
          - text: see the
          - link "basilica hours page" [ref=e775] [cursor=pointer]:
            - /url: https://www.basilicasanpietro.va/en/opening-hours
          - text: .
    - generic [ref=e776]:
      - heading "First-timer tips" [level=2] [ref=e777]
      - list [ref=e778]:
        - listitem [ref=e779]:
          - strong [ref=e780]: "Church dress code:"
          - text: shoulders and knees covered for both of you, enforced at St Peter's and the Vatican Museums. A light scarf solves it.
        - listitem [ref=e781]:
          - strong [ref=e782]: "Mid-October weather:"
          - text: highs 18–22°C, lows 10–13°C, mostly dry, sunset about 18:30. A light jacket for evenings and the catacombs.
        - listitem [ref=e783]:
          - strong [ref=e784]: "Water:"
          - text: the little street fountains (nasoni) run free, cold drinking water. Carry a bottle.
        - listitem [ref=e785]:
          - strong [ref=e786]: "Pickpockets:"
          - text: busy on bus 64, Metro A and at Termini. Bag in front, nothing in back pockets.
        - listitem [ref=e787]:
          - strong [ref=e788]: "Skip the Roma Pass:"
          - text: at €38–63 it does not pay back against the official prices here.
        - listitem [ref=e789]:
          - strong [ref=e790]: Ignore the touts
          - text: around the Colosseum and Vatican selling "skip the line"; you already have timed tickets.
        - listitem [ref=e791]:
          - strong [ref=e792]: "Eat where locals eat:"
          - text: Trastevere and Monti in the evening, Testaccio for the real Roman kitchen. Cacio e pepe, carbonara, supplì, and the Jewish artichokes in the Ghetto.
        - listitem [ref=e793]:
          - strong [ref=e794]: "Coffee:"
          - text: standing at the bar costs about €1.20; sitting down doubles it. Cappuccino is a morning drink.
        - listitem [ref=e795]:
          - strong [ref=e796]: "Sundays:"
          - text: Vatican Museums closed; many churches limit sightseeing during Mass.
        - listitem [ref=e797]:
          - strong [ref=e798]: "Apps:"
          - text: Google Maps handles ATAC buses well. Moovit shows live bus arrivals.
