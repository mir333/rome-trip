        - article [ref=e445]:
          - heading "Il Gesù, Sant'Ignazio & Santa Maria sopra Minerva" [level=3] [ref=e446]
          - generic [ref=e447]: Centre · Day 1 · Wed 14 Oct
          - paragraph [ref=e448]: Three churches within five minutes of the Pantheon. Il Gesù is the Jesuit mother church with the tomb of St Ignatius and the rooms where he lived and died (open afternoons). Sant'Ignazio has Pozzo's astonishing painted fake dome. Santa Maria sopra Minerva, Rome's only Gothic church, holds the body of St Catherine of Siena, Michelangelo's Risen Christ and Bernini's elephant obelisk outside.
