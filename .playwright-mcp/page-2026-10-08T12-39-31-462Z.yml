        - article [ref=e608]:
          - heading "Santa Maria Maggiore (tomb of Pope Francis)" [level=3] [ref=e609]
          - generic [ref=e610]: Esquiline · Day 4 · Sat 17 Oct
          - paragraph [ref=e611]: The largest Marian church in Rome, founded after the Council of Ephesus (431) and the only patriarchal basilica to keep its early Christian structure. 5th-century mosaics line the nave; the relic of the Holy Crib lies under the altar; the icon Salus Populi Romani is the one Pope Francis prayed before after every journey. He was buried here on 26 April 2025 in a plain tomb inscribed simply 'Franciscus', in the aisle beside the Pauline Chapel.
          - generic [ref=e612]:
