          - heading "San Pietro in Vincoli" [level=3] [ref=e537]
          - generic [ref=e538]: Ancient Rome / Monti · Day 3 · Fri 16 Oct
          - paragraph [ref=e539]: Built in 442 to house the chains that bound St Peter in Jerusalem and in Rome, displayed under the high altar. Michelangelo's Moses, carved for the tomb of Julius II, sits in the right transept. Five minutes uphill from the Colosseum.
