        - article [ref=e550]:
          - heading "Capitoline Hill & Vittoriano terrace" [level=3] [ref=e551]
          - generic [ref=e552]: Ancient Rome · Day 3 · Fri 16 Oct
          - paragraph [ref=e553]: Michelangelo's trapezoid piazza on the hill of Jupiter's temple. The Capitoline Museums, the world's oldest public museum (1471), keep the Capitoline Wolf, the Dying Gaul and the original Marcus Aurelius bronze. The free terrace behind the Senator's Palace gives the best view down the length of the Forum. Santa Maria in Aracoeli, up 124 steps, holds the Santo Bambino.
