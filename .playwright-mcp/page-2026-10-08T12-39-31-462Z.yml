          - heading "Piazza Navona" [level=3] [ref=e403]
          - generic [ref=e404]: Centre · Day 1 · Wed 14 Oct
          - paragraph [ref=e405]: Keeps the oval shape of Domitian's stadium (AD 86). Bernini's Fountain of the Four Rivers (1651) faces Borromini's church of Sant'Agnese in Agone, built where the 13-year-old St Agnes was martyred.
