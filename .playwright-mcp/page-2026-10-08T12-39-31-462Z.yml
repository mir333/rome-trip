        - article [ref=e593]:
          - heading "St John Lateran, Scala Santa & Santa Croce" [level=3] [ref=e594]
          - generic [ref=e595]: Esquiline / Lateran · Day 4 · Sat 17 Oct
          - paragraph [ref=e596]: The cathedral of Rome and 'mother of all churches', given by Constantine in 324, where the popes lived for a thousand years. The baptistery is the oldest in the world. Across the square, the Scala Santa are the 28 marble steps from Pilate's praetorium, brought by St Helena, climbed only on the knees. Ten minutes further, Santa Croce in Gerusalemme keeps the relics of the Passion that Helena brought from Jerusalem.
          - generic [ref=e597]:
            - term [ref=e598]: Price
            - definition [ref=e599]: Free. Cloister €3, optional.
