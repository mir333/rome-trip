        - article [ref=e578]:
          - heading "Catacombs of San Callisto & Appian Way" [level=3] [ref=e579]
          - generic [ref=e580]: Appia Antica · Day 4 · Sat 17 Oct
          - paragraph [ref=e581]: "The official cemetery of the Church of Rome in the 3rd century: 20 km of galleries, half a million burials, the Crypt of the Popes with nine 3rd-century popes, and the original tomb of St Cecilia. The Appian Way outside is the Roman road of 312 BC; walk past Domine Quo Vadis, where Peter met Christ fleeing Rome, to the tomb of Cecilia Metella (about 2 km on original basalt paving)."
