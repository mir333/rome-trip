        - article [ref=e490]:
          - heading "Borghese Gallery" [level=3] [ref=e491]
          - generic [ref=e492]: Villa Borghese · Day 2 · Thu 15 Oct
          - paragraph [ref=e493]: "Cardinal Scipione Borghese's 1613 villa holds the finest Bernini sculptures anywhere: Apollo and Daphne, the Rape of Proserpina, David. Plus six Caravaggios, Raphael's Deposition, Titian's Sacred and Profane Love and Canova's Pauline Bonaparte. Two hours is exactly right."
