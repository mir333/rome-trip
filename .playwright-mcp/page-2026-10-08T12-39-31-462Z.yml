      - generic [ref=e355]:
        - article [ref=e356]:
          - heading "St Peter's Square & Papal General Audience" [level=3] [ref=e357]
          - generic [ref=e358]: Vatican · Day 1 · Wed 14 Oct
          - paragraph [ref=e359]: "Bernini's colonnade (1656–67) embraces the square like two arms. On Wednesdays the Pope holds the General Audience here: a drive through the crowd in the popemobile, a catechesis in several languages, greetings to pilgrim groups, and the Apostolic Blessing, which also covers religious objects you bring. Pope Leo XIV held the 7 October audience as normal and no October journey is scheduled, so 14 October should go ahead."
          - generic [ref=e360]:
            - term [ref=e361]: Price
            - definition [ref=e362]: Free. Tickets are free but must be requested in advance.
            - term [ref=e363]: Hours
            - definition [ref=e364]: Audience Wed 10:00. Square opens ~07:30 on audience days; arrive by 08:00 for a good seat.
          - list [ref=e365]:
            - listitem [ref=e366]: Register on the Prefecture portal and request 2 tickets for Wed 14 Oct now. Collect at the Bronze Door (right colonnade) Tue 15:00–19:00 or Wed from 07:00, or follow the instructions in your confirmation email.
            - listitem [ref=e367]: Bring rosaries or medals to be blessed.
            - listitem [ref=e368]: Security screening is airport-style. No large bags.
          - generic [ref=e369]:
            - 'link "Info: Request free tickets (Prefecture of the Papal Household)" [ref=e370] [cursor=pointer]':
              - /url: https://eventi.pontificalisdomus.va/?lang=en-us
            - link "Directions" [ref=e371] [cursor=pointer]:
              - /url: https://www.google.com/maps/dir/?api=1&destination=41.9022,12.4573&travelmode=transit
        - article [ref=e372]:
          - heading "St Peter's Basilica & Dome climb" [level=3] [ref=e373]
          - generic [ref=e374]: Vatican · Day 1 · Wed 14 Oct
          - paragraph [ref=e375]: "The largest church in Christendom, built 1506–1626 over the tomb of the Apostle Peter. Inside: Michelangelo's Pietà, Bernini's bronze baldachin over the papal altar, the bronze statue of St Peter with its worn foot, and the Chair of Peter. Michelangelo designed the dome; 551 steps (320 if you take the lift to the roof) bring you inside the drum and then to the lantern with the best view in Rome. The Vatican Grottoes beneath hold the tombs of many popes, including St John Paul II's original resting place and Benedict XVI."
          - generic [ref=e376]:
            - term [ref=e377]: Price
