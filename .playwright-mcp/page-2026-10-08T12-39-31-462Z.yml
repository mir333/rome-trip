        - article [ref=e388]:
          - heading "Castel Sant'Angelo & Ponte Sant'Angelo" [level=3] [ref=e389]
          - generic [ref=e390]: Vatican / Centre · Day 1 · Wed 14 Oct
          - paragraph [ref=e391]: Hadrian's mausoleum (AD 139) became the popes' fortress, prison and treasury, linked to the Vatican by the Passetto, an elevated escape corridor used by Clement VII during the 1527 Sack of Rome. The bridge carries ten angels designed by Bernini holding the instruments of the Passion. The terrace is where Tosca jumps.
