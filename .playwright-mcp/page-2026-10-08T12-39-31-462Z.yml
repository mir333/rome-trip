        - article [ref=e564]:
          - heading "Jewish Ghetto, Tiber Island & Santa Maria in Trastevere" [level=3] [ref=e565]
          - generic [ref=e566]: Trastevere · Day 3 · Fri 16 Oct
          - paragraph [ref=e567]: Walk from the Capitoline through the Portico of Octavia and the old Ghetto (try the Jewish-Roman fried artichokes), across the Tiber Island with its 1st-century BC bridge, into Trastevere. Santa Maria in Trastevere, possibly the first church in Rome dedicated to Mary (3rd century, rebuilt 1140), glows with 12th- and 13th-century mosaics by Cavallini. Nearby Santa Cecilia stands over the house of the martyr.
