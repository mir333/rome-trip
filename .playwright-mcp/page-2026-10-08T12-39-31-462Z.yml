        - article [ref=e431]:
          - heading "Trevi Fountain & Spanish Steps" [level=3] [ref=e432]
          - generic [ref=e433]: Centre · Day 1 · Wed 14 Oct
          - paragraph [ref=e434]: The end point of the Aqua Virgo aqueduct of 19 BC, dressed in Nicola Salvi's Baroque facade (1762). Throw a coin with your right hand over your left shoulder to return to Rome. From here a 10-minute walk leads to the Spanish Steps and the church of Trinità dei Monti.
