        - article [ref=e476]:
          - heading "Santa Maria del Popolo & Pincio terrace" [level=3] [ref=e477]
          - generic [ref=e478]: North centre · Day 2 · Thu 15 Oct
          - paragraph [ref=e479]: Augustinian church on the spot of Nero's reputed grave. The Cerasi Chapel has Caravaggio's Conversion of St Paul and Crucifixion of St Peter; the Chigi Chapel was designed by Raphael and finished by Bernini. Climb the ramp behind to the Pincio terrace for the classic view over Piazza del Popolo to St Peter's dome.
