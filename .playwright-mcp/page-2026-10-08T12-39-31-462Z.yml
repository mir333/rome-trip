        - article [ref=e521]:
          - heading "Roman Forum & Palatine Hill" [level=3] [ref=e522]
          - generic [ref=e523]: Ancient Rome · Day 3 · Fri 16 Oct
          - paragraph [ref=e524]: "The civic heart of Rome for a thousand years: the Senate House (Curia), the Rostra where Cicero spoke, the Temple of Caesar where his body was burned, the Arch of Titus showing the loot of the Jerusalem Temple, and the Mamertine Prison where tradition holds Peter and Paul were held. The Palatine above is where Romulus founded the city in 753 BC and where emperors built their palaces; the view over the Circus Maximus is superb."
          - generic [ref=e525]:
            - term [ref=e526]: Price
            - definition [ref=e527]: Included in the Colosseum ticket.
