          - heading "St Paul Outside the Walls" [level=3] [ref=e624]
          - generic [ref=e625]: Ostiense · Day 5 · Sun 18 Oct
          - paragraph [ref=e626]: Built over the tomb of St Paul, rebuilt after the 1823 fire to the original 4th-century plan. The tomb sarcophagus is visible under the altar; the portraits of every pope ring the nave (legend says when the spaces run out the world ends). Metro B to Basilica San Paolo, 10 minutes from Colosseo.
