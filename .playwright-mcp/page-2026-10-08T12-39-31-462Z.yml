          - list [ref=e530]:
            - listitem [ref=e531]: Enter the Forum from Largo della Salara Vecchia on Via dei Fori Imperiali after the Colosseum.
            - listitem [ref=e532]: Santa Maria Antiqua and the Temple of Romulus are 'SUPER' sites included in the Full Experience.
