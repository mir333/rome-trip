        - article [ref=e505]:
          - heading "Colosseum" [level=3] [ref=e506]
          - generic [ref=e507]: Ancient Rome · Day 3 · Fri 16 Oct
          - paragraph [ref=e508]: The Flavian Amphitheatre, opened AD 80 by Titus, seated 50,000 for gladiatorial games and animal hunts. The Church has long venerated it as a place of martyrdom; the Pope leads the Good Friday Way of the Cross here. The Full Experience takes you onto the reconstructed arena floor and into the hypogeum, the underground corridors where lifts raised animals and scenery.
          - generic [ref=e509]:
            - term [ref=e510]: Price
            - definition [ref=e511]: Standard 24h ticket €18 (levels 1–2 + Forum + Palatine). Full Experience Underground & Arena €24, valid 2 days, recommended for history lovers.
            - term [ref=e512]: Hours
            - definition [ref=e513]: 08:30–18:30 until 24 Oct, last entry 17:30.
          - list [ref=e514]:
            - listitem [ref=e515]: "Tickets release 30 days ahead at 09:00 Italian time and the first slots sell out: book now for Fri 16 Oct, 08:30."
            - listitem [ref=e516]: "Tickets are nominal: enter the exact names on your passports."
            - listitem [ref=e517]: Max 75 minutes inside on the standard ticket.
